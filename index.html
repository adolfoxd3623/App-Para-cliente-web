<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de clientes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="formulario">
    <h1>Registro de clientes</h1>
    <form id="formulario-cliente" novalidate>
      <label for="cedula">Cédula</label>
      <input id="cedula" type="text" maxlength="10" inputmode="numeric" required>

      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" maxlength="30" required>

      <label for="direccion">Dirección</label>
      <input id="direccion" type="text" maxlength="50" required>

      <label for="telefono">Teléfono celular</label>
      <input id="telefono" type="tel" maxlength="10" inputmode="numeric" required>

      <label for="correo">Correo electrónico</label>
      <input id="correo" type="email" required>

      <button type="submit">Registrar</button>
      <button type="reset" class="limpiar">Limpiar</button>
      <p id="mensaje" role="status"></p>
    </form>
  </main>
</body>
</html>
